name: Feature request
description: Something the kit should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like the kit to do
      description: Remember the three rules in CONTRIBUTING.md - Node built-ins only, dry-run installers, every guard tested.
    validations:
      required: true
