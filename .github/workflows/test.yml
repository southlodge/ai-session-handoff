name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
      - run: npm run mutate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22

  diagrams:
    name: diagrams (rebuild byte for byte, checks proven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: build the five light diagrams (exits 1 on any failed check)
        run: node assets/diagrams/src/build.mjs
      - name: build their dark twins
        run: node assets/diagrams/src/build.mjs --theme dark
      - name: the committed SVGs are exactly what the sources draw
        run: |
          git status --porcelain -- assets/diagrams
          git diff --exit-code --stat -- assets/diagrams
          test -z "$(git status --porcelain -- assets/diagrams)"
      - name: every cited line and test name exists
        run: node assets/diagrams/src/check-cites.mjs
      - name: every check fails when its rule is broken (25 cases)
        run: node assets/diagrams/src/mutate.mjs assets/diagrams/src README.md "$RUNNER_TEMP/diagram-mutations"
